[package]
name = "freellm-chat"
version = "0.1.0"
description = "Interface de chat pour FreeLLMAPI"
edition = "2024"
rust-version = "1.90"

[lib]
name = "freellm_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Trousseau macOS (Keychain) pour stocker la clé FreeLLMAPI
keyring = { version = "3", features = ["apple-native"] }
# Client HTTP vers FreeLLMAPI. Pas de TLS : on ne parle qu'à 127.0.0.1.
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
