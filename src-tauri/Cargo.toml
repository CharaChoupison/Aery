[package]
name = "freellm-chat"
version = "0.1.0"
description = "Interface de chat pour FreeLLMAPI"
edition = "2024"
rust-version = "1.90"

[lib]
name = "freellm_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Trousseau macOS (Keychain) pour stocker la clé FreeLLMAPI
keyring = { version = "3", features = ["apple-native"] }
# Client HTTP vers FreeLLMAPI (127.0.0.1, sans proxy). TLS (rustls) seulement pour
# télécharger le modèle de dictée depuis Hugging Face (dictation.rs).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
tauri-plugin-dialog = "2"
walkdir = "2"
# Dictée locale : whisper.cpp (Metal) + micro. Compiler whisper.cpp demande cmake (brew install cmake).
whisper-rs = { version = "0.16", features = ["metal"] }
cpal = "0.18"
sha2 = "0.10"

# Son du Mac (ce qui sort des haut-parleurs) : « process tap » de Core Audio (macOS 14.2+),
# mêmes versions que celles utilisées par cpal.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-foundation = { version = "0.3.1", features = ["CFString", "CFDictionary", "CFArray"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSUUID", "NSValue"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

# whisper.cpp optimisé même en `npm run app:dev` : sans ça, la dictée en direct serait très lente.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
